# 事件分类体系 (A-G 大类 → 30+ 子类)
# 每个子类定义：方向基线、强度默认值、需要提取的字段

categories:
  A:  # 财报主事件
    label: "财报主事件"
    subcategories:
      earnings_q1:
        label: "一季报"
        direction_baseline: 0.0
        fields: [revenue, revenue_yoy_pct, net_profit, net_profit_yoy_pct,
                 gross_margin, net_margin, eps, roe, operating_cashflow]
      earnings_h1:
        label: "半年报"
        direction_baseline: 0.0
        fields: [revenue, revenue_yoy_pct, net_profit, net_profit_yoy_pct,
                 gross_margin, net_margin, eps, roe, operating_cashflow]
      earnings_q3:
        label: "三季报"
        direction_baseline: 0.0
        fields: [revenue, revenue_yoy_pct, net_profit, net_profit_yoy_pct,
                 gross_margin, net_margin, eps, roe, operating_cashflow]
      earnings_annual:
        label: "年报"
        direction_baseline: 0.0
        fields: [revenue, revenue_yoy_pct, net_profit, net_profit_yoy_pct,
                 gross_margin, net_margin, eps, roe, operating_cashflow,
                 dividend_plan, audit_opinion]
      operating_data:
        label: "经营数据"
        direction_baseline: 0.0
        fields: [reporting_period, revenue, sales_volume, output_volume,
                 yoy_change_pct, business_segment]

  B:  # 财报前置事件
    label: "财报前置事件"
    subcategories:
      forecast_performance:
        label: "业绩预告"
        direction_baseline: 0.0
        fields: [forecast_type, forecast_net_profit_min, forecast_net_profit_max,
                 forecast_yoy_change_pct, previous_net_profit, reason_summary]
      forecast_express:
        label: "业绩快报"
        direction_baseline: 0.0
        fields: [revenue, revenue_yoy_pct, net_profit, net_profit_yoy_pct, total_assets, net_assets]
      forecast_revision:
        label: "业绩修正"
        direction_baseline: 0.0
        fields: [original_forecast, revised_forecast, revision_amount, revision_pct, revision_reason]

  C:  # 股权变动事件
    label: "股权变动事件"
    subcategories:
      equity_increase:
        label: "增持"
        direction_baseline: 0.7
        fields: [shareholder_name, shareholder_type, increase_amount, increase_ratio_pct,
                 price_range, increase_reason, planned_continue]
      equity_decrease:
        label: "减持"
        direction_baseline: -0.7
        fields: [shareholder_name, shareholder_type, decrease_amount, decrease_ratio_pct,
                 price_range, decrease_reason, is_completed]
      buyback:
        label: "回购"
        direction_baseline: 0.8
        fields: [buyback_amount_max, buyback_ratio_pct, buyback_price_max,
                 buyback_purpose, funding_source, buyback_period]
      lockup_expiry:
        label: "解禁"
        direction_baseline: -0.5
        fields: [unlock_shares, unlock_ratio_pct, unlock_market_value, unlock_date, shareholder_list]
      equity_incentive:
        label: "股权激励"
        direction_baseline: 0.5
        fields: [incentive_shares, incentive_ratio_pct, grant_price, performance_targets,
                 recipient_count, vesting_schedule]
      no_reduce_commitment:
        label: "承诺不减持"
        direction_baseline: 0.1  # 控股股东自愿承诺不减持，微弱正面
        fields: [committing_shareholder, commitment_period, share_quantity, share_ratio_pct,
                 commitment_type, extension]
      buyback_cancel:
        label: "回购注销"
        direction_baseline: 0.0  # 限制性股票回购注销，中性
        fields: [cancelled_shares, cancel_ratio_pct, cancel_reason, original_grant_price,
                 affected_people, register_cancel_date]
      share_pledge:
        label: "股份质押/解质押"
        direction_baseline: 0.0
        fields: [shareholder_name, pledged_shares, pledged_ratio_pct, pledge_purpose,
                 pledgee, pledge_status, release_date]
      equity_change:
        label: "权益变动"
        direction_baseline: 0.0
        fields: [shareholder_name, change_type, changed_shares, changed_ratio_pct,
                 resulting_holding_ratio_pct, control_changed]
      dividend:
        label: "利润分配/分红"
        direction_baseline: 0.0
        fields: [cash_dividend_per_share, stock_dividend_ratio, record_date,
                 ex_dividend_date, payment_date, total_dividend]

  D:  # 资本运作事件
    label: "资本运作事件"
    subcategories:
      private_placement:
        label: "定增"
        direction_baseline: 0.1  # 不确定
        fields: [placement_amount, placement_shares, placement_price, placement_purpose,
                 subscribers, lockup_period, approval_status]
      merger_acquisition:
        label: "并购重组"
        direction_baseline: 0.3  # 短期偏正面，但风险高
        fields: [target_name, transaction_amount, payment_method, target_industry,
                 target_revenue, target_net_profit, deal_status, performance_commitment]
      asset_sale:
        label: "资产出售"
        direction_baseline: 0.2
        fields: [asset_name, sale_amount, book_value, gain_loss_amount, buyer, sale_reason]
      convertible_bond:
        label: "可转债/发债"
        direction_baseline: 0.1
        fields: [bond_amount, bond_term, coupon_rate, conversion_price, use_of_proceeds, credit_rating]
      fundraising_usage:
        label: "募集资金使用"
        direction_baseline: 0.0  # 募投项目/募集资金使用，中性
        fields: [project_name, fund_source, fund_amount, project_status,
                 expected_benefit, subsidiary_target]
      legal_opinion:
        label: "法律意见书"
        direction_baseline: 0.0  # 中介机构核查意见/法律意见书，中性
        fields: [opinion_type, issuing_institution, subject_matter, conclusion,
                 related_transaction, issuance_date]
      guarantee:
        label: "担保"
        direction_baseline: 0.0
        fields: [guarantor, guaranteed_party, guarantee_amount, guarantee_type,
                 guarantee_term, cumulative_guarantee_ratio_pct, overdue_guarantee]
      external_investment:
        label: "对外投资/设立公司"
        direction_baseline: 0.0
        fields: [target_name, investment_amount, ownership_ratio_pct, investment_purpose,
                 funding_source, project_location, approval_status]
      related_transaction:
        label: "关联交易"
        direction_baseline: 0.0
        fields: [related_party, relationship, transaction_type, transaction_amount,
                 pricing_basis, approval_status]
      financial_assistance:
        label: "财务资助"
        direction_baseline: 0.0
        fields: [recipient, assistance_amount, interest_rate, term, guarantee_measures,
                 related_party]
      financing_credit:
        label: "授信/融资"
        direction_baseline: 0.0
        fields: [financial_institution, credit_amount, financing_type, term,
                 interest_rate, collateral]
      hedging_derivatives:
        label: "套期保值/衍生品"
        direction_baseline: 0.0
        fields: [business_type, instrument, maximum_amount, hedged_exposure,
                 business_period, risk_controls]
      equity_financing:
        label: "股权融资/H股发行"
        direction_baseline: 0.0
        fields: [financing_type, financing_amount, issue_market, approval_status,
                 application_date, use_of_proceeds]
      treasury_management:
        label: "现金管理/委托理财"
        direction_baseline: 0.0
        fields: [fund_amount, product_type, financial_institution, investment_period,
                 funding_source, expected_yield]
      entrusted_management:
        label: "委托管理/终止委托管理"
        direction_baseline: 0.0
        fields: [manager, managed_asset, agreement_type, start_date, end_date,
                 termination_reason, business_impact]

  E:  # 经营业务事件
    label: "经营业务事件"
    subcategories:
      major_contract:
        label: "重大合同"
        direction_baseline: 0.6
        fields: [contract_amount, counterparty, contract_type, contract_period,
                 product_service, is_framework_agreement]
      bid_win:
        label: "中标"
        direction_baseline: 0.6
        fields: [project_name, bid_amount, project_owner, project_period, bid_rank]
      product_approval:
        label: "产品获批"
        direction_baseline: 0.7
        fields: [product_name, approval_type, regulatory_body, indication, market_size_estimate]
      project_commissioning:
        label: "项目投产"
        direction_baseline: 0.5
        fields: [project_name, capacity, investment_amount, expected_revenue_contribution, product_type]
      strategic_cooperation:
        label: "战略合作"
        direction_baseline: 0.4
        fields: [partner_name, cooperation_scope, cooperation_period, partner_type, exclusivity]
      government_subsidy:
        label: "政府补助/退税"
        direction_baseline: 0.0
        fields: [subsidy_amount, subsidy_type, granting_authority, accounting_treatment,
                 expected_profit_impact]
      intellectual_property:
        label: "专利/知识产权"
        direction_baseline: 0.0
        fields: [patent_name, patent_type, authorization_date, application_area,
                 expected_business_impact]
      project_investment:
        label: "项目投资/产能建设"
        direction_baseline: 0.0
        fields: [project_name, investment_amount, project_location, planned_capacity,
                 construction_period, funding_source, expected_return]
      project_progress:
        label: "项目进展"
        direction_baseline: 0.0
        fields: [project_name, project_stage, progress_summary, delay_reason,
                 expected_completion_date, business_impact]

  F:  # 风险事件
    label: "风险事件"
    subcategories:
      litigation:
        label: "诉讼"
        direction_baseline: -0.6
        fields: [case_type, involved_amount, plaintiff_defendant, case_status,
                 potential_loss_estimate, court_level]
      penalty:
        label: "处罚"
        direction_baseline: -0.7
        fields: [regulatory_body, penalty_type, penalty_amount, violation_type,
                 rectification_deadline, business_impact]
      investigation:
        label: "立案调查"
        direction_baseline: -0.9
        fields: [investigation_body, investigation_reason, subjects_involved, stage]
      debt_default:
        label: "债务逾期"
        direction_baseline: -0.9
        fields: [default_amount, default_ratio_pct, creditor, debt_type, default_reason, negotiation_status]
      st_delisting_risk:
        label: "ST/退市风险"
        direction_baseline: -0.95
        fields: [risk_type, trigger_condition, deadline, remediation_possible]
      bankruptcy_restructuring:
        label: "破产重整/清算"
        direction_baseline: -0.8
        fields: [case_stage, applicant, court, debt_claim_deadline, administrator,
                 restructuring_plan, business_impact]
      regulatory_action:
        label: "监管问询/监管措施"
        direction_baseline: 0.0
        fields: [regulatory_body, action_type, subject, issue_summary, reply_deadline,
                 rectification_requirement]
      asset_impairment:
        label: "资产减值"
        direction_baseline: -0.4
        fields: [asset_type, impairment_amount, profit_impact, impairment_reason,
                 reversibility]
      trading_risk_warning:
        label: "交易风险提示"
        direction_baseline: -0.1
        fields: [risk_summary, valuation_risk, business_risk, volatility_period,
                 company_clarification]
      judicial_equity_action:
        label: "股权司法冻结/拍卖"
        direction_baseline: -0.3
        fields: [shareholder_name, action_type, affected_shares, affected_ratio_pct,
                 court, auction_date, control_impact]
      tax_matter:
        label: "税务补缴/风险"
        direction_baseline: -0.2
        fields: [tax_type, payment_amount, reporting_period, authority,
                 penalty_amount, profit_impact]

  G:  # 治理与交易状态事件
    label: "治理与交易状态事件"
    subcategories:
      executive_change:
        label: "高管变动"
        direction_baseline: 0.0
        fields: [executive_name, position, change_type, reason, successor, background]
      controller_change:
        label: "实控人变更"
        direction_baseline: 0.2
        fields: [new_controller, old_controller, change_method, transfer_ratio, transfer_price,
                 new_controller_bg, regulatory_approval_needed]
      trading_halt_resume:
        label: "停复牌"
        direction_baseline: 0.0
        fields: [halt_reason, halt_date, resume_date, expected_duration]
      abnormal_volatility:
        label: "异常波动"
        direction_baseline: 0.0
        fields: [volatility_period, volatility_type, company_explanation, regulatory_inquiry]
      meeting_resolution:
        label: "会议决议/通知"
        direction_baseline: 0.0  # 董事会/股东会决议与会议通知，中性
        fields: [meeting_type, meeting_date, resolution_summary, related_issue, approval_status]
      investor_relations:
        label: "投资者关系活动"
        direction_baseline: 0.0  # 投资者关系活动记录，中性
        fields: [activity_date, activity_type, participants, topics_covered, company_highlights]
      accounting_change:
        label: "会计政策/估计变更"
        direction_baseline: 0.0
        fields: [change_type, effective_date, reason, affected_items, profit_impact,
                 retrospective_adjustment]
      auditor_change:
        label: "审计机构变更/续聘"
        direction_baseline: 0.0
        fields: [old_auditor, new_auditor, change_type, reason, audit_fee,
                 approval_status]

  X:  # 非核心事件与拒绝分类出口
    label: "其他与待复核"
    subcategories:
      routine_disclosure:
        label: "例行披露"
        direction_baseline: 0.0
        fields: []
      supporting_document:
        label: "中介/支持性文件"
        direction_baseline: 0.0
        fields: []
      corporate_admin:
        label: "工商登记/行政变更"
        direction_baseline: 0.0
        fields: []
      h_share_routine:
        label: "H股例行披露"
        direction_baseline: 0.0
        fields: []
      other:
        label: "其他/待判断"
        direction_baseline: 0.0
        fields: []
