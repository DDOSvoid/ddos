# 跟踪公司列表
# 可以按行业分组管理重点关注的公司
# stock_code: SSE 用 .SH 后缀，SZSE 用 .SZ 后缀

# event-ranking v1：正式数据集覆盖全部 A 股中有合格公告的公司。
# 下方手工代码只用于无凭证环境下验证公开公告下载链路。
track_all: true

# 试点行业
pilot_industries:
  - "电气设备"
  - "新能源"
  - "光伏"

# 无凭证下载 smoke 使用的手动列表；track_all=true 时不限定正式股票池
