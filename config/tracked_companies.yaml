# 跟踪公司列表
# 可以按行业分组管理重点关注的公司
# stock_code: SSE 用 .SH 后缀，SZSE 用 .SZ 后缀

# 默认：全部跟踪（MVP 阶段先以新能源为试点）
track_all: false

# 试点行业
pilot_industries:
  - "电气设备"
  - "新能源"
  - "光伏"

# 手动指定跟踪列表（如果 track_all: false）
tracked_codes:
  # 新能源 - 光伏
  - "601012.SH"   # 隆基绿能
  - "600438.SH"   # 通威股份
  - "002459.SZ"   # 晶澳科技
  - "688599.SH"   # 天合光能
  - "300274.SZ"   # 阳光电源

  # 新能源 - 锂电池
  - "300750.SZ"   # 宁德时代
  - "002074.SZ"   # 国轩高科
  - "300014.SZ"   # 亿纬锂能
  - "002812.SZ"   # 恩捷股份

  # 新能源 - 风电
  - "002202.SZ"   # 金风科技
  - "601615.SH"   # 明阳智能

  # 医药（备用试点）
  # - "600276.SH"   # 恒瑞医药
  # - "300760.SZ"   # 迈瑞医疗
  # - "300347.SZ"   # 泰格医药
  # - "603259.SH"   # 药明康德

# 排除的股票类型
exclude:
  - "ST"           # ST 股票
  - "*ST"          # 退市预警
  - "退市"
  - "N"            # 新股首日
  - "C"            # 次新股
