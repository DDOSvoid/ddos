# 行业划分配置 — 将 Tushare 原始行业标签（申万一级）映射到粗分行业域
#
# 用途: classify 步骤为每条公告写入 industry_group，便于下游按行业差异化处理
#       （如未来按领域路由专家模型）。
#
# - groups: 行业域 → 该域下的申万一级行业列表
# - default_group: 未命中映射的行业（或空行业）自动归入的兜底域
#
# 覆盖数据库当前全部 110 个申万一级行业；新增行业只需在对应组追加即可。

default_group: "其他"

